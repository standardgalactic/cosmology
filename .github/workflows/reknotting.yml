name: Reknotting proof of concept

on:
  push:
    paths:
      - "experiments/python/**"
      - "Makefile"
      - ".github/workflows/reknotting.yml"
  pull_request:
    paths:
      - "experiments/python/**"
      - "Makefile"
      - ".github/workflows/reknotting.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make reknotting-test
